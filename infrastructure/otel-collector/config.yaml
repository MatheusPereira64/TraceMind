# OpenTelemetry Collector for TraceMind.
#
# Receives OTLP (gRPC 4317 / HTTP 4318) from instrumented applications and forwards traces to the
# TraceMind ingestion endpoint as OTLP/HTTP JSON, authenticated with a project API key:
#
#   TRACEMIND_COLLECTOR_API_KEY  API key of the project that should receive the traces (required
#                                for forwarding; without it the export fails with 401 and is logged)
#   TRACEMIND_INGEST_URL         API base URL as seen from the collector container

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  batch:
    send_batch_size: 512
    timeout: 5s

exporters:
  debug:
    verbosity: basic
  otlphttp/tracemind:
    traces_endpoint: ${env:TRACEMIND_INGEST_URL}/v1/ingest/otlp/v1/traces
    # TraceMind accepts the JSON encoding of OTLP/HTTP.
    encoding: json
    headers:
      Authorization: Bearer ${env:TRACEMIND_COLLECTOR_API_KEY}
    retry_on_failure:
      enabled: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, otlphttp/tracemind]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
