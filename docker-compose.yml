# TraceMind — full local stack.
#
#   cp .env.example .env      # then set JWT_SECRET (and passwords)
#   docker compose up --build
#
# Dashboard: http://localhost:3000   API: http://localhost:4000   OTLP: 4317 (gRPC) / 4318 (HTTP)

name: tracemind

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgres://${POSTGRES_USER:-tracemind}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-tracemind}
  REDIS_URL: redis://redis:6379

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracemind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tracemind}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies pending migrations and syncs the model price registry, then exits.
  # The API starts only if it succeeds.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: tracemind-api:local
    command: ['sh', '-c', 'node dist/database/migrate.js && node dist/pricing/sync.js']
    environment:
      <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    image: tracemind-api:local
    restart: unless-stopped
    environment:
      <<: *api-env
      PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -base64 48)}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      # Plain HTTP locally; set to true behind TLS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      INGESTION_CONCURRENCY: ${INGESTION_CONCURRENCY:-4}
    ports:
      - '${API_PORT:-4000}:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
    image: tracemind-web:local
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.154.0
    restart: unless-stopped
    command: ['--config=/etc/otelcol/config.yaml']
    environment:
      TRACEMIND_INGEST_URL: http://api:4000
      # Create an API key in the dashboard, put it in .env and restart the collector.
      TRACEMIND_COLLECTOR_API_KEY: ${TRACEMIND_COLLECTOR_API_KEY:-}
    volumes:
      - ./infrastructure/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - '4317:4317'
      - '4318:4318'

volumes:
  postgres-data:
  redis-data:
