name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tracemind
          POSTGRES_PASSWORD: tracemind
          POSTGRES_DB: tracemind_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tracemind -d tracemind_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL_TEST: postgres://tracemind:tracemind@localhost:5432/tracemind_test
      REDIS_URL: redis://localhost:6379
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages (shared, sdk)
        run: pnpm --filter "./packages/**" run build
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Integration tests (API against Postgres + Redis)
        run: pnpm --filter @tracemind/api run test:e2e
      - name: Migrations are in sync with the schema
        working-directory: apps/api
        run: |
          pnpm exec drizzle-kit generate --name ci-check
          git diff --exit-code --stat -- drizzle || (echo "Schema changed without a migration. Run pnpm db:generate." && exit 1)
      - run: pnpm build
