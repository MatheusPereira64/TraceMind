# TraceMind — production deployment on a single server, behind Caddy with automatic HTTPS.
#
#   cp .env.production.example .env.production   # fill in every value
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Only Caddy publishes ports (80 and 443). PostgreSQL, Redis, the API and the dashboard are
# reachable only on the internal network. See docs/DEPLOYMENT.md.

name: tracemind

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgres://${POSTGRES_USER:-tracemind}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tracemind}
  REDIS_URL: redis://redis:6379

x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: '5'

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      TRACEMIND_DOMAIN: ${TRACEMIND_DOMAIN:?set TRACEMIND_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    logging: *logging

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracemind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tracemind}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF keeps queued ingestion batches across restarts. noeviction: BullMQ must never lose keys.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  # One-shot: applies pending migrations and syncs the model price registry, then exits.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: tracemind-api:${TRACEMIND_VERSION:-latest}
    command: ['sh', '-c', 'node dist/database/migrate.js && node dist/pricing/sync.js']
    environment:
      <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    logging: *logging

  api:
    image: tracemind-api:${TRACEMIND_VERSION:-latest}
    restart: unless-stopped
    environment:
      <<: *api-env
      PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (openssl rand -base64 48)}
      WEB_ORIGIN: https://${TRACEMIND_DOMAIN}
      COOKIE_SECURE: 'true'
      # The API is reachable only through Caddy (and the dashboard proxy behind it).
      TRUST_PROXY: 'true'
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      INGESTION_CONCURRENCY: ${INGESTION_CONCURRENCY:-4}
      INGEST_RATE_LIMIT_PER_MINUTE: ${INGEST_RATE_LIMIT_PER_MINUTE:-600}
      RETENTION_ENABLED: ${RETENTION_ENABLED:-true}
      RETENTION_CRON: '${RETENTION_CRON:-17 3 * * *}'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    logging: *logging

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Shown in the setup snippets of the dashboard; baked into the client bundle.
        NEXT_PUBLIC_API_URL: https://${TRACEMIND_DOMAIN}
    image: tracemind-web:${TRACEMIND_VERSION:-latest}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

  # Optional: receive OTLP gRPC from applications that cannot send OTLP/HTTP JSON directly.
  #   docker compose -f docker-compose.prod.yml --env-file .env.production --profile otel up -d
  # Listens on 127.0.0.1 only: expose it through a private network or VPN, never publicly.
  otel-collector:
    profiles: ['otel']
    image: otel/opentelemetry-collector-contrib:0.154.0
    restart: unless-stopped
    command: ['--config=/etc/otelcol/config.yaml']
    environment:
      TRACEMIND_INGEST_URL: http://api:4000
      # A project API key; without it the collector receives data but cannot forward it (401).
      TRACEMIND_COLLECTOR_API_KEY: ${TRACEMIND_COLLECTOR_API_KEY:-}
    volumes:
      - ./infrastructure/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - '127.0.0.1:4317:4317'
      - '127.0.0.1:4318:4318'
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
